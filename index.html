<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOPIK Vocabulary Trainer</title>
<style>
body { font-family: Arial, sans-serif; margin:20px; }
.level-grid { display:flex; gap:10px; flex-wrap:wrap; }
.level-card { border:1px solid #ccc; padding:10px; width:180px; border-radius:5px; position:relative; }
.level-card.disabled { opacity:0.5; }
.mode-btn { display:block; margin:5px 0; width:100%; }
.status-badge { background:#f0f0f0; padding:2px 5px; font-size:0.8em; border-radius:3px; }
#learningMode { display:none; margin-top:20px; }
#learningMode.active { display:block; }
.choice-btn { display:block; margin:5px 0; width:100%; padding:5px; }
.choice-btn.correct { background: #c8f7c5; }
.choice-btn.incorrect { background: #f7c5c5; }
.selected { font-weight:bold; }
#mcFeedback, #tpFeedback { margin-top:10px; display:none; font-weight:bold; }
#mcFeedback.show, #tpFeedback.show { display:block; }
#mcFeedback.correct, #tpFeedback.correct { color:green; }
#mcFeedback.incorrect, #tpFeedback.incorrect { color:red; }
.example-sentence { font-size:0.9em; color:#555; margin-bottom:5px; }
.input-box { width:30px; text-align:center; margin:2px; font-size:1.2em; }
#tpSubmitBtn { margin-top:10px; padding:5px 10px; }
</style>
</head>
<body>

<h1>TOPIK Vocabulary Trainer</h1>

<div id="levelSelection">
  <h2>Level Selection</h2>
  <div class="level-grid" id="levelGrid"></div>
</div>

<div id="learningMode">
  <h2 id="modeTitle"></h2>

  <!-- MC Mode -->
  <div id="mcMode">
    <div id="koreanWord" style="font-size:1.5em; margin-bottom:5px;"></div>
    <div id="choices"></div>
    <div id="mcFeedback"></div>
    <button id="mcNextBtn" onclick="nextMCQuestion()">Next</button>
  </div>

  <!-- TP Mode -->
  <div id="tpMode">
    <div id="posLabel"></div>
    <div id="englishWord" style="font-size:1.5em; margin-bottom:5px;"></div>
    <div id="exampleSentence" class="example-sentence"></div>
    <div id="inputBoxes"></div>
    <div id="tpFeedback"></div>
    <button id="tpSubmitBtn" onclick="submitTypingPractice()">제출</button>
  </div>
</div>

<script>
// 전역 상태
let currentLevel = null;
let currentMode = null;
let levelData = {};
let currentQuestions = [];
let currentQuestionIndex = 0;
let score = 0;
let answered = false;

// localStorage 키
const STORAGE_KEY = 'vocabProgress';

// 초기화
initializeApp();

// 예시 레벨 데이터 (실제 데이터로 교체 가능)
levelData = {
    1: [
        { id:1, korean:'사과', english:'apple', pos:'명사', example:'나는 사과를 먹었다.' },
        { id:2, korean:'먹다', english:'eat', pos:'동사', example:'밥을 먹다.' },
        { id:3, korean:'빠르다', english:'fast', pos:'형용사', example:'그는 빠르다.' },
        { id:4, korean:'책상', english:'desk', pos:'명사', example:'책상 위에 책이 있다.' },
        { id:5, korean:'크다', english:'big', pos:'형용사', example:'집이 크다.' },
        // 30개 이상 추가 가능
    ],
    2: [],
    3: [],
    4: [],
    5: []
};

function initializeApp() {
    loadProgressFromStorage();
    renderLevelSelection();
}

// localStorage 로드
function loadProgressFromStorage() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (!saved) {
        initializeProgress();
        return;
    }
    window.progress = JSON.parse(saved);
}

function initializeProgress() {
    window.progress = { levels: {} };
    for (let i=1; i<=5; i++) {
        window.progress.levels[i] = { mcPassed:false, tpPassed:false, mcScore:0, tpScore:0 };
    }
    saveProgressToStorage();
}

function saveProgressToStorage() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(window.progress));
}

// 레벨 선택
function renderLevelSelection() {
    const levelGrid = document.getElementById('levelGrid');
    levelGrid.innerHTML = '';

    for (let i=1; i<=5; i++) {
        const levelInfo = window.progress.levels[i];
        const isUnlocked = i===1 || (window.progress.levels[i-1].mcPassed && window.progress.levels[i-1].tpPassed);

        const card = document.createElement('div');
        card.className = `level-card ${isUnlocked?'':'disabled'}`;

        let statusHTML = '';
        if (levelInfo.mcPassed && levelInfo.tpPassed) {
            statusHTML = '<div class="status-badge">✓ 완료</div>';
        }

        let mcScoreText = levelInfo.mcScore ? `MC: ${levelInfo.mcScore}/${levelData[i].length}` : '';
        let tpScoreText = levelInfo.tpScore ? `TP: ${levelInfo.tpScore}/${levelData[i].length}` : '';

        card.innerHTML = `
            <div class="level-title">Level ${i}</div>
            <div class="mode-buttons">
                <button class="mode-btn mc" ${isUnlocked?'':'disabled'} onclick="startMode(${i}, 'mc')">Multiple Choice</button>
                <button class="mode-btn tp" ${isUnlocked?'':'disabled'} onclick="startMode(${i}, 'tp')">Typing Practice</button>
            </div>
            ${statusHTML}
            <div class="status-badge" style="margin-top:10px;">${mcScoreText} ${tpScoreText}</div>
        `;
        levelGrid.appendChild(card);
    }

    document.getElementById('levelSelection').style.display='block';
    document.getElementById('learningMode').classList.remove('active');
}

// 모드 시작
function startMode(level, mode) {
    currentLevel=level;
    currentMode=mode;
    currentQuestionIndex=0;
    score=0;
    answered=false;

    currentQuestions = [...levelData[level]].sort(()=>Math.random()-0.5);

    document.getElementById('levelSelection').style.display='none';
    document.getElementById('learningMode').classList.add('active');

    document.getElementById('mcMode').style.display = mode==='mc'?'block':'none';
    document.getElementById('tpMode').style.display = mode==='tp'?'block':'none';
    document.getElementById('modeTitle').textContent = mode==='mc'?`Level ${level} - Multiple Choice`:`Level ${level} - Typing Practice`;

    if(mode==='mc') displayMCQuestion();
    else displayTPQuestion();
}

// MC 문제
function displayMCQuestion() {
    if(currentQuestionIndex>=currentQuestions.length) { showResultModal(); return; }
    answered=false;
    document.getElementById('mcFeedback').classList.remove('show');
    document.getElementById('mcNextBtn').disabled=true;

    const q = currentQuestions[currentQuestionIndex];
    document.getElementById('koreanWord').innerHTML = `<div class="pos-label">(${q.pos})</div>${q.korean}`;

    if(!document.getElementById('mcExampleSentence')) {
        const exampleDiv = document.createElement('div');
        exampleDiv.id='mcExampleSentence';
        exampleDiv.className='example-sentence';
        document.getElementById('mcMode').appendChild(exampleDiv);
    }
    document.getElementById('mcExampleSentence').textContent = `"${q.example}"`;

    const answers=[q.english];
    const others=currentQuestions.filter(x=>x.id!==q.id);
    while(answers.length<4) {
        const r=others[Math.floor(Math.random()*others.length)].english;
        if(!answers.includes(r)) answers.push(r);
    }
    answers.sort(()=>Math.random()-0.5);

    const choicesDiv=document.getElementById('choices');
    choicesDiv.innerHTML='';
    answers.forEach((a, idx)=>{
        const btn=document.createElement('button');
        btn.className='choice-btn';
        btn.textContent=a;
        btn.onclick=()=>selectMCAnswer(a,q.english,idx);
        choicesDiv.appendChild(btn);
    });
}

function selectMCAnswer(selected, correct, idx){
    if(answered) return;
    answered=true;
    const isCorrect=selected===correct;
    if(isCorrect) score++;

    const choiceBtns=document.querySelectorAll('.choice-btn');
    choiceBtns.forEach((btn,i)=>{
        btn.disabled=true;
        if(i===idx) btn.classList.add('selected', isCorrect?'correct':'incorrect');
    });

    const feedback=document.getElementById('mcFeedback');
    feedback.textContent=isCorrect?'✓ 정답입니다!':`✗ 오답입니다. 정답: ${correct}`;
    feedback.classList.add('show', isCorrect?'correct':'incorrect');
    document.getElementById('mcNextBtn').disabled=false;
}

function nextMCQuestion(){
    currentQuestionIndex++;
    if(currentQuestionIndex>=currentQuestions.length) showResultModal();
    else displayMCQuestion();
}

// TP 문제
function displayTPQuestion(){
    if(currentQuestionIndex>=currentQuestions.length) { showResultModal(); return; }
    answered=false;
    document.getElementById('tpFeedback').classList.remove('show');
    document.getElementById('tpSubmitBtn').disabled=false;

    const q=currentQuestions[currentQuestionIndex];
    document.getElementById('posLabel').textContent=`(${q.pos})`;
    document.getElementById('englishWord').textContent=q.english;
    document.getElementById('exampleSentence').textContent=`"${q.example}"`;

    const inputBoxes=document.getElementById('inputBoxes');
    inputBoxes.innerHTML='';
    for(let i=0;i<q.korean.length;i++){
        const input=document.createElement('input');
        input.type='text';
        input.className='input-box';
        input.maxLength=1;
        input.onkeydown=(e)=>{
            if(e.key==='Backspace'){ e.preventDefault(); input.value=''; if(i>0) inputBoxes.children[i-1].focus();}
            if(e.key==='Enter'){ e.preventDefault(); submitTypingPractice();}
        };
        inputBoxes.appendChild(input);
    }
    if(inputBoxes.children.length>0) inputBoxes.children[0].focus();
}

function submitTypingPractice(){
    if(answered) return;
    answered=true;
    const q=currentQuestions[currentQuestionIndex];
    const inputBoxes=Array.from(document.querySelectorAll('.input-box'));
    const userAnswer=inputBoxes.map(box=>box.value).join('');
    const isCorrect=userAnswer===q.korean;
    if(isCorrect) score++;

    inputBoxes.forEach((box,idx)=>{
        box.disabled=true;
        if(userAnswer[idx]===q.korean[idx]) box.classList.add('correct');
        else box.classList.add('incorrect');
    });

    const feedback=document.getElementById('tpFeedback');
    feedback.textContent=isCorrect?'✓ 정답입니다!':`✗ 오답입니다. 정답: ${q.korean}`;
    feedback.classList.add('show', isCorrect?'correct':'incorrect');
    document.getElementById('tpSubmitBtn').disabled=true;
}

// 결과
function showResultModal(){
    const total=currentQuestions.length;
    const passScore=Math.ceil(total*0.9);
    const passed=score>=passScore;
    alert(`테스트 완료!\n점수: ${score}/${total}\n${passed?'합격!':'불합격'}`);

    const levelInfo=window.progress.levels[currentLevel];
    if(currentMode==='mc'){ levelInfo.mcScore=score; if(passed) levelInfo.mcPassed=true;}
    if(currentMode==='tp'){ levelInfo.tpScore=score; if(passed) levelInfo.tpPassed=true;}
    saveProgressToStorage();
    renderLevelSelection();
}
</script>
</body>
</html>
