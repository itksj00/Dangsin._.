<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shrimp - Vocabulary Learning</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .level-selection {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .level-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .level-card:hover:not(.disabled) {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .level-card.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .level-title {
            font-size: 1.5em;
            color: #333;
            margin-bottom: 15px;
        }

        .mode-buttons {
            display: flex;
            gap: 10px;
            flex-direction: column;
        }

        .mode-btn {
            padding: 12px 15px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .mode-btn.mc {
            background: #3498db;
            color: white;
        }

        .mode-btn.mc:hover:not(:disabled) {
            background: #2980b9;
        }

        .mode-btn.tp {
            background: #e74c3c;
            color: white;
        }

        .mode-btn.tp:hover:not(:disabled) {
            background: #c0392b;
        }

        .mode-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status-badge {
            display: inline-block;
            background: #2ecc71;
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8em;
            margin-top: 10px;
        }

        /* Learning Mode Styles */
        .learning-mode {
            display: none;
        }

        .learning-mode.active {
            display: block;
        }

        .learning-container {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .learning-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 20px;
        }

        .learning-title {
            font-size: 1.8em;
            color: #333;
        }

        .progress-info {
            text-align: right;
            color: #666;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #ecf0f1;
            border-radius: 10px;
            margin-top: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #2ecc71;
            transition: width 0.3s ease;
        }

        .question-container {
            text-align: center;
            margin: 40px 0;
        }

        .question-text {
            font-size: 2.5em;
            color: #333;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .pos-label {
            font-size: 0.9em;
            color: #7f8c8d;
            margin-bottom: 5px;
        }

        .example-sentence {
            font-size: 1.1em;
            color: #555;
            font-style: italic;
            margin-top: 15px;
            padding: 15px;
            background: #f8f9fa;
            border-left: 4px solid #3498db;
        }

        /* Multiple Choice */
        .choices {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 30px;
        }

        .choice-btn {
            padding: 20px;
            font-size: 1.1em;
            border: 2px solid #bdc3c7;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .choice-btn:hover {
            border-color: #3498db;
            background: #ecf0f1;
        }

        .choice-btn.selected.correct {
            background: #2ecc71;
            border-color: #27ae60;
            color: white;
        }

        .choice-btn.selected.incorrect {
            background: #e74c3c;
            border-color: #c0392b;
            color: white;
        }

        .choice-btn:disabled {
            cursor: not-allowed;
        }

        /* Typing Practice */
        .typing-container {
            margin-top: 30px;
        }

        .input-boxes {
            display: flex;
            gap: 5px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 30px 0;
        }

        .input-box {
            width: 40px;
            height: 50px;
            border: 2px solid #bdc3c7;
            border-radius: 5px;
            text-align: center;
            font-size: 1.2em;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .input-box:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 10px rgba(52, 152, 219, 0.3);
        }

        .input-box.correct {
            background: #2ecc71;
            color: white;
            border-color: #27ae60;
        }

        .input-box.incorrect {
            background: #e74c3c;
            color: white;
            border-color: #c0392b;
        }

        .input-box:disabled {
            cursor: not-allowed;
        }

        /* Feedback */
        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            display: none;
        }

        .feedback.show {
            display: block;
        }

        .feedback.correct {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .feedback.incorrect {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        /* Result Modal */
        .result-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .result-modal.show {
            display: flex;
        }

        .result-content {
            background: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            max-width: 500px;
        }

        .result-title {
            font-size: 2em;
            margin-bottom: 20px;
            color: #333;
        }

        .result-score {
            font-size: 3em;
            font-weight: 700;
            margin: 20px 0;
            color: #3498db;
        }

        .result-message {
            font-size: 1.2em;
            margin: 20px 0;
            color: #555;
        }

        .result-buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            justify-content: center;
        }

        .result-btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .result-btn.retry {
            background: #3498db;
            color: white;
        }

        .result-btn.retry:hover {
            background: #2980b9;
        }

        .result-btn.home {
            background: #95a5a6;
            color: white;
        }

        .result-btn.home:hover {
            background: #7f8c8d;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            justify-content: center;
        }

        .action-btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .action-btn.next {
            background: #3498db;
            color: white;
        }

        .action-btn.next:hover {
            background: #2980b9;
        }

        .action-btn.back {
            background: #95a5a6;
            color: white;
        }

        .action-btn.back:hover {
            background: #7f8c8d;
        }

        .action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>

                            <div class="progress-bar">

                            </div>
                        </div>
                    </div>
                    <button class="action-btn back" onclick="backToLevelSelection()">← 돌아가기</button>
                </div>

                <!-- Multiple Choice Mode -->
                <div id="mcMode">
                    <div class="question-container">
                        <div class="pos-label" id="mcPosLabel"></div>

                        <div class="choices" id="choices"></div>

                        <div class="action-buttons">
                            <button class="action-btn next" id="mcNextBtn" onclick="nextMCQuestion()" disabled>다음</button>

                    </div>
                </div>

                            </div>

                    </div>
                </div>
            </div>
        </div>

        <!-- Result Modal -->
        <div class="result-modal" id="resultModal">

                <div class="result-title" id="resultTitle"></div>
                <div class="result-score" id="resultScore"></div>
                <div class="result-message" id="resultMessage"></div>
                <div class="result-buttons">
                    <button class="result-btn retry" id="retryBtn" onclick="retryMode()">재시도</button>
                    <button class="result-btn home" onclick="backToLevelSelection()">돌아가기</button>
                </div>
            </div>
        </div>

        // localStorage에서 진행 상태 로드
        function loadProgressFromStorage() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (!saved) {
                initializeProgress();
                return;
            }
            window.progress = JSON.parse(saved);
        }

        // 진행 상태 초기화
        function initializeProgress() {
            window.progress = {
                levels: {}
            };
            for (let i = 1; i <= 5; i++) {
                window.progress.levels[i] = {
                    mcPassed: false,
                    tpPassed: false,
                    mcScore: 0,
                    tpScore: 0,
                    mcTotal: 0,
                    tpTotal: 0
                };
            }
            saveProgressToStorage();
        }

        // localStorage에 진행 상태 저장
        function saveProgressToStorage() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(window.progress));
        }

        // 레벨 선택 화면 렌더링
        function renderLevelSelection() {
            const levelGrid = document.getElementById('levelGrid');
            levelGrid.innerHTML = '';

            for (let i = 1; i <= 5; i++) {
                const levelInfo = window.progress.levels[i];
                const isUnlocked = i === 1 || (window.progress.levels[i - 1].mcPassed && window.progress.levels[i - 1].tpPassed);
                
                const card = document.createElement('div');
                card.className = `level-card ${isUnlocked ? '' : 'disabled'}`;

                let statusHTML = '';
                if (levelInfo.mcPassed && levelInfo.tpPassed) {
                    statusHTML = '<div class="status-badge">✓ 완료</div>';
                }

                let scoreHTML = '';
                if (levelInfo.mcTotal > 0 || levelInfo.tpTotal > 0) {
                    scoreHTML = '<div class="score-display">';
                    if (levelInfo.mcTotal > 0) {
                        scoreHTML += `<span class="mc-score">MC: ${levelInfo.mcScore}/${levelInfo.mcTotal}</span>`;
                    }
                    if (levelInfo.tpTotal > 0) {
                        scoreHTML += `<span class="tp-score">TP: ${levelInfo.tpScore}/${levelInfo.tpTotal}</span>`;
                    }
                    scoreHTML += '</div>';
                }

                card.innerHTML = `
                    <div class="level-title">Level ${i}</div>
                    <div class="mode-buttons">
                        <button class="mode-btn mc" ${isUnlocked ? '' : 'disabled'} onclick="startMode(${i}, 'mc')">
                            Multiple Choice
                        </button>
                        <button class="mode-btn tp" ${isUnlocked ? '' : 'disabled'} onclick="startMode(${i}, 'tp')">
                            Typing Practice
                        </button>
                    </div>
                    ${scoreHTML}
                    ${statusHTML}
                `;
                levelGrid.appendChild(card);
            }

            document.getElementById('levelSelection').style.display = 'block';
            document.getElementById('learningMode').classList.remove('active');
        }

        // 학습 모드 시작
        function startMode(level, mode) {
            currentLevel = level;
            currentMode = mode;
            currentQuestionIndex = 0;
            score = 0;
            answered = false;

            // 문제 순서 랜덤화
            currentQuestions = [...levelData[level]].sort(() => Math.random() - 0.5);

            document.getElementById('levelSelection').style.display = 'none';
            document.getElementById('learningMode').classList.add('active');

            // 모드별 UI 표시
            document.getElementById('mcMode').style.display = mode === 'mc' ? 'block' : 'none';
            document.getElementById('tpMode').style.display = mode === 'tp' ? 'block' : 'none';

            const modeTitle = mode === 'mc' ? `Level ${level} - Multiple Choice` : `Level ${level} - Typing Practice`;
            document.getElementById('modeTitle').textContent = modeTitle;

            if (mode === 'mc') {
                displayMCQuestion();
            } else {
                displayTPQuestion();
            }
        }

        // Multiple Choice 문제 표시
        function displayMCQuestion() {
            if (currentQuestionIndex >= currentQuestions.length) {
                showResultModal();
                return;
            }

            answered = false;
            document.getElementById('mcFeedback').classList.remove('show', 'correct', 'incorrect');
            document.getElementById('mcNextBtn').disabled = true;

            const question = currentQuestions[currentQuestionIndex];
            document.getElementById('mcPosLabel').textContent = `(${question.pos})`;
            document.getElementById('koreanWord').textContent = question.korean;
            document.getElementById('mcExampleSentence').textContent = `"${question.example}"`;

            // 보기 생성 (정답 + 3개 오답)
            const answers = [question.english];
            const otherWords = currentQuestions.filter(q => q.id !== question.id);
            while (answers.length < 4) {
                const randomWord = otherWords[Math.floor(Math.random() * otherWords.length)].english;
                if (!answers.includes(randomWord)) {
                    answers.push(randomWord);
                }
            }
            answers.sort(() => Math.random() - 0.5);

            const choicesDiv = document.getElementById('choices');
            choicesDiv.innerHTML = '';
            answers.forEach((answer, idx) => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.textContent = answer;
                btn.onclick = () => selectMCAnswer(answer, question.english, idx);
                choicesDiv.appendChild(btn);
            });

            updateProgress();
        }

        // MC 답변 선택
        function selectMCAnswer(selected, correct, idx) {
            if (answered) return;
            answered = true;

            const isCorrect = selected === correct;
            if (isCorrect) score++;

            const choiceBtns = document.querySelectorAll('.choice-btn');
            choiceBtns.forEach((btn, i) => {
                btn.disabled = true;
                if (i === idx) {
                    btn.classList.add('selected', isCorrect ? 'correct' : 'incorrect');
                }
            });

            const feedback = document.getElementById('mcFeedback');
            feedback.textContent = isCorrect ? '✓ 정답입니다!' : `✗ 오답입니다. 정답: ${correct}`;
            feedback.classList.add('show', isCorrect ? 'correct' : 'incorrect');
            document.getElementById('mcNextBtn').disabled = false;
        }

        // MC 다음 문제
        function nextMCQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex >= currentQuestions.length) {
                showResultModal();
            } else {
                displayMCQuestion();
            }
        }

        // Typing Practice 문제 표시
        function displayTPQuestion() {
            if (currentQuestionIndex >= currentQuestions.length) {
                showResultModal();
                return;
            }

            answered = false;
            document.getElementById('tpFeedback').classList.remove('show', 'correct', 'incorrect');
            document.getElementById('tpSubmitBtn').disabled = false;

            const question = currentQuestions[currentQuestionIndex];
            document.getElementById('posLabel').textContent = `(${question.pos})`;
            document.getElementById('englishWord').textContent = question.english;
            document.getElementById('exampleSentence').textContent = `"${question.example}"`;

            // 입력 박스 생성
            const inputBoxes = document.getElementById('inputBoxes');
            inputBoxes.innerHTML = '';
            for (let i = 0; i < question.korean.length; i++) {
                const input = document.createElement('input');
                input.type = 'text';
                input.className = 'input-box';
                input.dataset.index = i;
                
                // 한글 조합 완료 시에만 다음 박스로 이동
                input.addEventListener('input', (e) => {
                    const value = e.target.value;
                    // 완전한 한글 한 글자가 입력되었는지 확인
                    if (value.length === 1 && /[가-힣]/.test(value)) {
                        if (i < question.korean.length - 1) {
                            inputBoxes.children[i + 1].focus();
                        }
                    }
                });

                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace') {
                        e.preventDefault();
                        input.value = '';
                        if (i > 0) {
                            inputBoxes.children[i - 1].focus();
                        }
                    } else if (e.key === 'Enter') {
                        e.preventDefault();
                        submitTypingPractice();
                    }
                });

                inputBoxes.appendChild(input);
            }

            if (inputBoxes.children.length > 0) {
                inputBoxes.children[0].focus();
            }

            updateProgress();
        }

        // TP 제출
        function submitTypingPractice() {
            if (answered) return;
            answered = true;

            const question = currentQuestions[currentQuestionIndex];
            const inputBoxes = Array.from(document.querySelectorAll('.input-box'));
            const userAnswer = inputBoxes.map(box => box.value).join('');
            const isCorrect = userAnswer === question.korean;

            if (isCorrect) score++;

            inputBoxes.forEach((box, idx) => {
                box.disabled = true;
                if (userAnswer[idx] === question.korean[idx]) {
                    box.classList.add('correct');
                } else {
                    box.classList.add('incorrect');
                }
            });

            const feedback = document.getElementById('tpFeedback');
            feedback.textContent = isCorrect ? '✓ 정답입니다!' : `✗ 오답입니다. 정답: ${question.korean}`;
            feedback.classList.add('show', isCorrect ? 'correct' : 'incorrect');

            document.getElementById('tpSubmitBtn').disabled = true;
            
            // 1초 후 자동으로 다음 문제로 이동
            setTimeout(() => {
                nextTPQuestion();
            }, 1500);
        }

        // TP 다음 문제
        function nextTPQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex >= currentQuestions.length) {
                showResultModal();
            } else {
                displayTPQuestion();
            }
        }

        // 결과 모달 표시
        function showResultModal() {
            const passScore = 27; // 30문제 중 27문제 이상
            const totalQuestions = currentQuestions.length;
            const isPassed = score >= passScore;
            const percentage = Math.round((score / totalQuestions) * 100);

            document.getElementById('resultTitle').textContent = isPassed ? '축하합니다! 🎉' : '다시 시도해주세요 📝';
            document.getElementById('resultScore').textContent = `${score} / ${totalQuestions}`;
            document.getElementById('resultMessage').textContent = `정답률: ${percentage}% ${isPassed ? '통과했습니다!' : '통과하지 못했습니다.'}`;

            // 진행 상태 저장
            if (currentMode === 'mc') {
                window.progress.levels[currentLevel].mcScore = score;
                window.progress.levels[currentLevel].mcTotal = totalQuestions;
                if (isPassed) {
                    window.progress.levels[currentLevel].mcPassed = true;
                }
            } else {
                window.progress.levels[currentLevel].tpScore = score;
                window.progress.levels[currentLevel].tpTotal = totalQuestions;
                if (isPassed) {
                    window.progress.levels[currentLevel].tpPassed = true;
                }
            }
            saveProgressToStorage();

            // 레벨 클리어 확인 및 축하 메시지
            const levelInfo = window.progress.levels[currentLevel];
            if (levelInfo.mcPassed && levelInfo.tpPassed && isPassed) {
                // 방금 레벨을 완료한 경우에만 표시
                setTimeout(() => {
                    alert('갈채! 해냈어 애기! 기특해. 공부도 중요하지만 당신을 항상 아껴주기! 🦐💖');
                }, 500);
            }

            document.getElementById('resultModal').classList.add('show');
        }

        // 재시도
        function retryMode() {
            document.getElementById('resultModal').classList.remove('show');
            startMode(currentLevel, currentMode);
        }

        // 돌아가기
        function backToLevelSelection() {
            document.getElementById('resultModal').classList.remove('show');
            document.getElementById('learningMode').classList.remove('active');
            renderLevelSelection();
        }

        // 진행률 업데이트
        function updateProgress() {
            const total = currentQuestions.length;
            const current = currentQuestionIndex + 1;
            document.getElementById('questionCounter').textContent = `${current} / ${total}`;
            const percentage = (current / total) * 100;
            document.getElementById('progressFill').style.width = `${percentage}%`;
        }

        // 앱 시작
        window.addEventListener('DOMContentLoaded', initializeApp);
    </script>
