<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shrimp - Vocabulary Learning</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .level-selection {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .level-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .level-card:hover:not(.disabled) {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .level-card.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .level-icon {
            width: 60px;
            height: 60px;
            margin: 0 auto 15px;
            position: relative;
        }

        .level-icon.cat {
            background: linear-gradient(135deg, #ff9a56 0%, #ff6b6b 100%);
            border-radius: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .level-icon.cat::before {
            content: '🐱';
            font-size: 35px;
            position: absolute;
        }

        .level-icon.princess {
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
            border-radius: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.4);
        }

        .level-icon.princess::before {
            content: '👸';
            font-size: 35px;
            position: absolute;
        }

        .level-icon.wolf {
            background: linear-gradient(135deg, #6c757d 0%, #495057 100%);
            border-radius: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .level-icon.wolf::before {
            content: '🐺';
            font-size: 35px;
            position: absolute;
        }

        .level-icon.coffee {
            background: linear-gradient(135deg, #d4a574 0%, #8b6f47 100%);
            border-radius: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .level-icon.coffee::before {
            content: '';
            position: absolute;
            width: 12px;
            height: 16px;
            background: linear-gradient(135deg, #ffffff 0%, #e8e8e8 100%);
            top: 2px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 2px 2px 0 0;
            box-shadow: 
                0 2px 0 rgba(0,0,0,0.1),
                inset 0 -2px 0 rgba(52, 152, 219, 0.3);
        }

        .level-icon.coffee::after {
            content: '';
            position: absolute;
            width: 3px;
            height: 18px;
            background: linear-gradient(180deg, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0.5) 100%);
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 2px;
        }

        .level-icon.coffee .cup {
            position: absolute;
            font-size: 22px;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
        }

        .level-icon.snitch {
            background: linear-gradient(135deg, #87ceeb 0%, #4682b4 100%);
            border-radius: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: visible;
        }

        .level-icon.snitch::before {
            content: '';
            position: absolute;
            width: 15px;
            height: 15px;
            background: radial-gradient(circle, #ffd700 0%, #daa520 100%);
            border-radius: 50%;
            top: 15px;
            left: 18px;
            box-shadow: 
                -12px -2px 0 -6px #daa520,
                -14px -4px 0 -6px #daa520,
                -16px -3px 0 -6px #daa520,
                12px -2px 0 -6px #daa520,
                14px -4px 0 -6px #daa520,
                16px -3px 0 -6px #daa520,
                0 0 10px rgba(255, 215, 0, 0.6);
        }

        .level-icon.snitch::after {
            content: '🧹';
            font-size: 28px;
            position: absolute;
            bottom: 5px;
            right: 8px;
            transform: rotate(30deg);
        }

        .level-title {
            font-size: 1.5em;
            color: #333;
            margin-bottom: 15px;
        }

        .mode-buttons {
            display: flex;
            gap: 10px;
            flex-direction: column;
        }

        .mode-btn {
            padding: 12px 15px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .mode-btn.mc {
            background: #3498db;
            color: white;
        }

        .mode-btn.mc:hover:not(:disabled) {
            background: #2980b9;
        }

        .mode-btn.tp {
            background: #e74c3c;
            color: white;
        }

        .mode-btn.tp:hover:not(:disabled) {
            background: #c0392b;
        }

        .mode-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status-badge {
            display: inline-block;
            background: #2ecc71;
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8em;
            margin-top: 10px;
        }

        .score-display {
            font-size: 0.85em;
            color: #666;
            margin-top: 8px;
        }

        .score-display .mc-score,
        .score-display .tp-score {
            display: inline-block;
            margin: 0 5px;
            padding: 3px 8px;
            background: #ecf0f1;
            border-radius: 10px;
        }

        .learning-mode {
            display: none;
        }

        .learning-mode.active {
            display: block;
        }

        .learning-container {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .learning-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 20px;
        }

        .learning-title {
            font-size: 1.8em;
            color: #333;
        }

        .progress-info {
            text-align: right;
            color: #666;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #ecf0f1;
            border-radius: 10px;
            margin-top: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #2ecc71;
            transition: width 0.3s ease;
        }

        .question-container {
            text-align: center;
            margin: 40px 0;
        }

        .question-text {
            font-size: 2.5em;
            color: #333;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .pos-label {
            font-size: 0.9em;
            color: #7f8c8d;
            margin-bottom: 5px;
        }

        .example-sentence {
            font-size: 1.1em;
            color: #555;
            font-style: italic;
            margin-top: 15px;
            padding: 15px;
            background: #f8f9fa;
            border-left: 4px solid #3498db;
        }

        .choices {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 30px;
        }

        .choice-btn {
            padding: 20px;
            font-size: 1.1em;
            border: 2px solid #bdc3c7;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .choice-btn:hover {
            border-color: #3498db;
            background: #ecf0f1;
        }

        .choice-btn.selected.correct {
            background: #2ecc71;
            border-color: #27ae60;
            color: white;
        }

        .choice-btn.selected.incorrect {
            background: #e74c3c;
            border-color: #c0392b;
            color: white;
        }

        .choice-btn:disabled {
            cursor: not-allowed;
        }

        .typing-container {
            margin-top: 30px;
        }

        .input-boxes {
            display: flex;
            gap: 5px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 30px 0;
        }

        .input-box {
            width: 40px;
            height: 50px;
            border: 2px solid #bdc3c7;
            border-radius: 5px;
            text-align: center;
            font-size: 1.2em;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .input-box:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 10px rgba(52, 152, 219, 0.3);
        }

        .input-box.correct {
            background: #2ecc71;
            color: white;
            border-color: #27ae60;
        }

        .input-box.incorrect {
            background: #e74c3c;
            color: white;
            border-color: #c0392b;
        }

        .input-box:disabled {
            cursor: not-allowed;
        }

        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            display: none;
        }

        .feedback.show {
            display: block;
        }

        .feedback.correct {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .feedback.incorrect {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .result-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .result-modal.show {
            display: flex;
        }

        .result-content {
            background: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            max-width: 500px;
        }

        .result-title {
            font-size: 2em;
            margin-bottom: 20px;
            color: #333;
        }

        .result-score {
            font-size: 3em;
            font-weight: 700;
            margin: 20px 0;
            color: #3498db;
        }

        .result-message {
            font-size: 1.2em;
            margin: 20px 0;
            color: #555;
        }

        .result-buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            justify-content: center;
        }

        .result-btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .result-btn.retry {
            background: #3498db;
            color: white;
        }

        .result-btn.retry:hover {
            background: #2980b9;
        }

        .result-btn.home {
            background: #95a5a6;
            color: white;
        }

        .result-btn.home:hover {
            background: #7f8c8d;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            justify-content: center;
        }

        .action-btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .action-btn.next {
            background: #3498db;
            color: white;
        }

        .action-btn.next:hover {
            background: #2980b9;
        }

        .action-btn.back {
            background: #95a5a6;
            color: white;
        }

        .action-btn.back:hover {
            background: #7f8c8d;
        }

        .action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .stats-button {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: white;
            border: none;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            z-index: 999;
        }

        .stats-button:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }

        .stats-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1001;
        }

        .stats-modal.show {
            display: flex;
        }

        .stats-content {
            background: white;
            padding: 40px;
            border-radius: 15px;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .stats-header {
            font-size: 2em;
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 15px;
        }

        .stats-section {
            margin-bottom: 30px;
        }

        .stats-section h3 {
            color: #3498db;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            background: #f8f9fa;
            margin-bottom: 8px;
            border-radius: 5px;
        }

        .stat-label {
            font-weight: 600;
            color: #555;
        }

        .stat-value {
            color: #3498db;
            font-weight: 700;
        }

        .mistake-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .mistake-item {
            padding: 12px;
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            margin-bottom: 8px;
            border-radius: 5px;
        }

        .mistake-word {
            font-weight: 700;
            color: #333;
            font-size: 1.1em;
        }

        .mistake-count {
            color: #e74c3c;
            font-size: 0.9em;
            margin-top: 5px;
        }

        .close-stats-btn {
            width: 100%;
            padding: 12px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
        }

        .close-stats-btn:hover {
            background: #2980b9;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🦐 Shrimp</h1>
            <p>당신을 위한 나의 마음</p>
        </div>

        <div id="levelSelection">
            <div class="level-selection" id="levelGrid"></div>
        </div>

        <div id="learningMode" class="learning-mode">
            <div class="learning-container">
                <div class="learning-header">
                    <div>
                        <div class="learning-title" id="modeTitle"></div>
                        <div class="progress-info">
                            <span id="questionCounter">1 / 30</span>
                            <div class="progress-bar">
                                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                            </div>
                        </div>
                    </div>
                    <button class="action-btn back" onclick="backToLevelSelection()">← 돌아가기</button>
                </div>

                <div id="mcMode">
                    <div class="question-container">
                        <div class="pos-label" id="mcPosLabel"></div>
                        <div class="question-text" id="koreanWord"></div>
                        <div class="example-sentence" id="mcExampleSentence"></div>
                        <div class="choices" id="choices"></div>
                        <div class="feedback" id="mcFeedback"></div>
                        <div class="action-buttons">
                            <button class="action-btn next" id="mcNextBtn" onclick="nextMCQuestion()" disabled>다음</button>
                        </div>
                    </div>
                </div>

                <div id="tpMode">
                    <div class="question-container">
                        <div class="pos-label" id="posLabel"></div>
                        <div class="question-text" id="englishWord"></div>
                        <div class="example-sentence" id="exampleSentence"></div>
                        <div class="typing-container">
                            <div class="input-boxes" id="inputBoxes"></div>
                            <div class="feedback" id="tpFeedback"></div>
                            <div class="action-buttons">
                                <button class="action-btn next" id="tpSubmitBtn" onclick="submitTypingPractice()">제출</button>
                                <button class="action-btn next" id="tpNextBtn" onclick="nextTPQuestion()" style="display:none;">다음</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="result-modal" id="resultModal">
            <div class="result-content">
                <div class="result-title" id="resultTitle"></div>
                <div class="result-score" id="resultScore"></div>
                <div class="result-message" id="resultMessage"></div>
                <div class="result-buttons">
                    <button class="result-btn retry" id="retryBtn" onclick="retryMode()">재시도</button>
                    <button class="result-btn home" onclick="backToLevelSelection()">돌아가기</button>
                </div>
            </div>
        </div>

        <div class="stats-modal" id="statsModal">
            <div class="stats-content">
                <div class="stats-header">📊 학습 통계</div>
                
                <div class="stats-section">
                    <h3>전체 학습 현황</h3>
                    <div class="stat-item">
                        <span class="stat-label">총 학습한 단어 수</span>
                        <span class="stat-value" id="totalWords">0개</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">총 정답 수</span>
                        <span class="stat-value" id="totalCorrect">0개</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">전체 정답률</span>
                        <span class="stat-value" id="totalAccuracy">0%</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">완료한 레벨</span>
                        <span class="stat-value" id="completedLevels">0개</span>
                    </div>
                </div>

                <div class="stats-section">
                    <h3>자주 틀리는 단어 TOP 10</h3>
                    <div class="mistake-list" id="mistakeList">
                        <p style="text-align: center; color: #999;">아직 데이터가 없습니다.</p>
                    </div>
                </div>

                <button class="close-stats-btn" onclick="closeStatsModal()">닫기</button>
            </div>
        </div>

        <button class="stats-button" onclick="showStatsModal()">📊</button>
    </div>

    <script>
        let currentLevel = null;
        let currentMode = null;
        let levelData = {};
        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let answered = false;

        const STORAGE_KEY = 'vocabProgress';
        const STATS_KEY = 'vocabStats';

        function initializeApp() {
            loadProgressFromStorage();
            loadStatsFromStorage();
            loadLevelData();
            renderLevelSelection();
        }

        function loadStatsFromStorage() {
            const saved = localStorage.getItem(STATS_KEY);
            if (!saved) {
                window.stats = {
                    totalAttempts: 0,
                    totalCorrect: 0,
                    mistakes: {}
                };
                saveStatsToStorage();
                return;
            }
            window.stats = JSON.parse(saved);
        }

        function saveStatsToStorage() {
            localStorage.setItem(STATS_KEY, JSON.stringify(window.stats));
        }

        function recordAnswer(questionId, english, korean, isCorrect) {
            window.stats.totalAttempts++;
            if (isCorrect) {
                window.stats.totalCorrect++;
            } else {
                const key = english + '|' + korean;
                if (!window.stats.mistakes[key]) {
                    window.stats.mistakes[key] = {
                        english: english,
                        korean: korean,
                        count: 0
                    };
                }
                window.stats.mistakes[key].count++;
            }
            saveStatsToStorage();
        }

function loadLevelData() {
            levelData = {
                1: [
                    {id:1,english:"consequence",korean:"결과",pos:"noun",example:"This has serious consequences.",korExample:"이것은 심각한 결과를 초래합니다."},
                    {id:2,english:"phenomenon",korean:"현상",pos:"noun",example:"A natural phenomenon.",korExample:"자연 현상입니다."},
                    {id:3,english:"fundamental",korean:"근본적인",pos:"adjective",example:"A fundamental principle.",korExample:"근본적인 원칙입니다."},
                    {id:4,english:"aspect",korean:"측면",pos:"noun",example:"Consider every aspect.",korExample:"모든 측면을 고려하세요."},
                    {id:5,english:"approach",korean:"접근법",pos:"noun",example:"A different approach.",korExample:"다른 접근법입니다."},
                    {id:6,english:"perspective",korean:"관점",pos:"noun",example:"From my perspective.",korExample:"제 관점에서는요."},
                    {id:7,english:"constitute",korean:"구성하다",pos:"verb",example:"These constitute the whole.",korExample:"이것들이 전체를 구성합니다."},
                    {id:8,english:"implement",korean:"시행하다",pos:"verb",example:"Implement the plan.",korExample:"계획을 시행하세요."},
                    {id:9,english:"enhance",korean:"향상시키다",pos:"verb",example:"Enhance your skills.",korExample:"기술을 향상시키세요."},
                    {id:10,english:"demonstrate",korean:"입증하다",pos:"verb",example:"Demonstrate your ability.",korExample:"능력을 입증하세요."},
                    {id:11,english:"significant",korean:"중요한",pos:"adjective",example:"A significant change.",korExample:"중요한 변화입니다."},
                    {id:12,english:"sufficient",korean:"충분한",pos:"adjective",example:"Sufficient evidence.",korExample:"충분한 증거입니다."},

        function loadProgressFromStorage() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (!saved) {
                initializeProgress();
                return;
            }
            window.progress = JSON.parse(saved);
        }

        function initializeProgress() {
            window.progress = { levels: {} };
            for (let i = 1; i <= 5; i++) {
                window.progress.levels[i] = {
                    mcPassed: false,
                    tpPassed: false,
                    mcScore: 0,
                    tpScore: 0,
                    mcTotal: 0,
                    tpTotal: 0
                };
            }
            saveProgressToStorage();
        }

        function saveProgressToStorage() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(window.progress));
        }

        function renderLevelSelection() {
            const levelGrid = document.getElementById('levelGrid');
            levelGrid.innerHTML = '';
            const levelClasses = ['cat', 'princess', 'wolf', 'coffee', 'snitch'];

            for (let i = 1; i <= 5; i++) {
                const levelInfo = window.progress.levels[i];
                const isUnlocked = i === 1 || (window.progress.levels[i - 1].mcPassed && window.progress.levels[i - 1].tpPassed);
                
                const card = document.createElement('div');
                card.className = 'level-card' + (isUnlocked ? '' : ' disabled');

                let statusHTML = '';
                if (levelInfo.mcPassed && levelInfo.tpPassed) {
                    statusHTML = '<div class="status-badge">✓ 완료</div>';
                }

                let scoreHTML = '';
                if (levelInfo.mcTotal > 0 || levelInfo.tpTotal > 0) {
                    scoreHTML = '<div class="score-display">';
                    if (levelInfo.mcTotal > 0) {
                        scoreHTML += '<span class="mc-score">MC: ' + levelInfo.mcScore + '/' + levelInfo.mcTotal + '</span>';
                    }
                    if (levelInfo.tpTotal > 0) {
                        scoreHTML += '<span class="tp-score">TP: ' + levelInfo.tpScore + '/' + levelInfo.tpTotal + '</span>';
                    }
                    scoreHTML += '</div>';
                }

                card.innerHTML = '<div class="level-icon ' + levelClasses[i-1] + '">' + (i === 4 ? '<span class="cup">☕</span>' : '') + '</div>' +
                    '<div class="level-title">Level ' + i + '</div>' +
                    '<div class="mode-buttons">' +
                        '<button class="mode-btn mc" ' + (isUnlocked ? '' : 'disabled') + ' onclick="startMode(' + i + ', \'mc\')">Multiple Choice</button>' +
                        '<button class="mode-btn tp" ' + (isUnlocked ? '' : 'disabled') + ' onclick="startMode(' + i + ', \'tp\')">Typing Practice</button>' +
                    '</div>' +
                    scoreHTML +
                    statusHTML;
                levelGrid.appendChild(card);
            }

            document.getElementById('levelSelection').style.display = 'block';
            document.getElementById('learningMode').classList.remove('active');
        }

        function startMode(level, mode) {
            currentLevel = level;
            currentMode = mode;
            currentQuestionIndex = 0;
            score = 0;
            answered = false;

            currentQuestions = levelData[level].slice().sort(function() { return Math.random() - 0.5; });

            document.getElementById('levelSelection').style.display = 'none';
            document.getElementById('learningMode').classList.add('active');

            document.getElementById('mcMode').style.display = mode === 'mc' ? 'block' : 'none';
            document.getElementById('tpMode').style.display = mode === 'tp' ? 'block' : 'none';

            const modeTitle = mode === 'mc' ? 'Level ' + level + ' - Multiple Choice' : 'Level ' + level + ' - Typing Practice';
            document.getElementById('modeTitle').textContent = modeTitle;

            if (mode === 'mc') {
                displayMCQuestion();
            } else {
                displayTPQuestion();
            }
        }

        function displayMCQuestion() {
            if (currentQuestionIndex >= currentQuestions.length) {
                showResultModal();
                return;
            }

            answered = false;
            document.getElementById('mcFeedback').classList.remove('show', 'correct', 'incorrect');
            document.getElementById('mcNextBtn').disabled = true;

            const question = currentQuestions[currentQuestionIndex];
            document.getElementById('mcPosLabel').textContent = '(' + question.pos + ')';
            document.getElementById('koreanWord').textContent = question.korean;
            document.getElementById('mcExampleSentence').textContent = question.korExample;

            const answers = [question.english];
            const otherWords = currentQuestions.filter(function(q) { return q.id !== question.id; });
            while (answers.length < 4) {
                const randomWord = otherWords[Math.floor(Math.random() * otherWords.length)].english;
                if (answers.indexOf(randomWord) === -1) {
                    answers.push(randomWord);
                }
            }
            answers.sort(function() { return Math.random() - 0.5; });

            const choicesDiv = document.getElementById('choices');
            choicesDiv.innerHTML = '';
            answers.forEach(function(answer, idx) {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.textContent = answer;
                btn.onclick = function() { selectMCAnswer(answer, question.english, idx); };
                choicesDiv.appendChild(btn);
            });

            updateProgress();
            document.addEventListener('keydown', handleMCEnter);
        }

        function handleMCEnter(e) {
            if (e.key === 'Enter' && !document.getElementById('mcNextBtn').disabled) {
                nextMCQuestion();
            }
        }

        function selectMCAnswer(selected, correct, idx) {
            const question = currentQuestions[currentQuestionIndex];
            if (answered) return;

            const isCorrect = selected === correct;
            answered = true;

            if (isCorrect) {
                score++;
                recordAnswer(question.id, question.english, question.korean, true);
            } else {
                recordAnswer(question.id, question.english, question.korean, false);
            }

            const choiceBtns = document.querySelectorAll('.choice-btn');
            // 모든 버튼 비활성화하고 정답/오답 상태 표시
            choiceBtns.forEach(function(btn, i) {
                btn.disabled = true;
                if (btn.textContent === correct) {
                    btn.classList.add('selected', 'correct');
                }
            });

            // 선택한 버튼은 틀렸다면 빨간 표시
            if (!isCorrect) {
                choiceBtns[idx].classList.add('selected', 'incorrect');
            }

            const feedback = document.getElementById('mcFeedback');
            if (isCorrect) {
                feedback.textContent = '✓ 정답입니다!';
                feedback.classList.add('show', 'correct');
            } else {
                feedback.textContent = '✗ 오답입니다. 정답: ' + correct;
                feedback.classList.add('show', 'incorrect');
            }

            document.getElementById('mcNextBtn').disabled = false;
        }

        function nextMCQuestion() {
            document.removeEventListener('keydown', handleMCEnter);
            currentQuestionIndex++;
            if (currentQuestionIndex >= currentQuestions.length) {
                showResultModal();
            } else {
                displayMCQuestion();
            }
        }

        function displayTPQuestion() {
            if (currentQuestionIndex >= currentQuestions.length) {
                showResultModal();
                return;
            }

            answered = false;
            document.getElementById('tpFeedback').classList.remove('show', 'correct', 'incorrect');
            document.getElementById('tpSubmitBtn').disabled = false;
            document.getElementById('tpSubmitBtn').style.display = 'inline-block';
            
            const tpNextBtn = document.getElementById('tpNextBtn');
            if (tpNextBtn) {
                tpNextBtn.style.display = 'none';
            }

            const question = currentQuestions[currentQuestionIndex];
            document.getElementById('posLabel').textContent = '(' + question.pos + ')';
            document.getElementById('englishWord').textContent = question.english;
            document.getElementById('exampleSentence').textContent = question.example;

            const inputBoxes = document.getElementById('inputBoxes');
            inputBoxes.innerHTML = '';
            
            for (let i = 0; i < question.korean.length; i++) {
                const input = document.createElement('input');
                input.type = 'text';
                input.className = 'input-box';
                input.dataset.index = i;
                input.maxLength = 1;
                
                let composing = false;
                
                input.addEventListener('compositionstart', function() {
                    composing = true;
                });
                
                input.addEventListener('compositionend', function(e) {
                    composing = false;
                    const value = e.target.value;
                    if (value.length === 1 && i < question.korean.length - 1) {
                        setTimeout(function() {
                            inputBoxes.children[i + 1].focus();
                        }, 0);
                    }
                });

                input.addEventListener('keydown', function(e) {
                    if (e.key === 'Backspace') {
                        if (input.value === '' && i > 0) {
                            e.preventDefault();
                            inputBoxes.children[i - 1].focus();
                        }
                    } else if (e.key === 'Enter') {
                        e.preventDefault();
                        if (document.getElementById('tpSubmitBtn').style.display !== 'none') {
                            submitTypingPractice();
                        } else {
                            nextTPQuestion();
                        }
                    }
                });

                inputBoxes.appendChild(input);
            }

            if (inputBoxes.children.length > 0) {
                inputBoxes.children[0].focus();
            }

            updateProgress();
        }

        function submitTypingPractice() {
            if (answered) return;
            answered = true;

            const question = currentQuestions[currentQuestionIndex];
            const inputBoxes = Array.from(document.querySelectorAll('.input-box'));
            const userAnswer = inputBoxes.map(function(box) { return box.value; }).join('');
            const isCorrect = userAnswer === question.korean;

            if (isCorrect) score++;

            recordAnswer(question.id, question.english, question.korean, isCorrect);

            inputBoxes.forEach(function(box, idx) {
                box.disabled = true;
                if (userAnswer[idx] === question.korean[idx]) {
                    box.classList.add('correct');
                } else {
                    box.classList.add('incorrect');
                    // 원복: 사용자가 입력한 글자를 덮어쓰지 않음 (정답 글자로 바꾸지 않음)
                }
            });

            const feedback = document.getElementById('tpFeedback');
            feedback.textContent = isCorrect ? '✓ 정답입니다!' : '✗ 오답입니다. 정답: ' + question.korean;
            feedback.classList.add('show', isCorrect ? 'correct' : 'incorrect');

            const tpSubmitBtn = document.getElementById('tpSubmitBtn');
            const tpNextBtn = document.getElementById('tpNextBtn');
            if (tpSubmitBtn) {
                tpSubmitBtn.style.display = 'none';
                tpSubmitBtn.disabled = true;
            }
            if (tpNextBtn) {
                tpNextBtn.style.display = 'inline-block';
                tpNextBtn.disabled = false;
            }
        }

        function nextTPQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex >= currentQuestions.length) {
                showResultModal();
            } else {
                displayTPQuestion();
            }
        }

        function showResultModal() {
            const totalQuestions = currentQuestions.length;
            const passScore = Math.ceil(totalQuestions * 0.9);
            const isPassed = score >= passScore;
            const percentage = Math.round((score / totalQuestions) * 100);

            let resultTitle = '';
            if (isPassed) {
                resultTitle = currentMode === 'mc' ? 'Schönen Tag 🎉' : 'Tschüssikowski! 🎊';
            } else {
                resultTitle = '다시 시도해주세요 📝';
            }

            document.getElementById('resultTitle').textContent = resultTitle;
            document.getElementById('resultScore').textContent = score + ' / ' + totalQuestions;
            document.getElementById('resultMessage').textContent = '정답률: ' + percentage + '% ' + (isPassed ? '통과했습니다!' : '통과하지 못했습니다.');

            if (currentMode === 'mc') {
                window.progress.levels[currentLevel].mcScore = score;
                window.progress.levels[currentLevel].mcTotal = totalQuestions;
                if (isPassed) {
                    window.progress.levels[currentLevel].mcPassed = true;
                }
            } else {
                window.progress.levels[currentLevel].tpScore = score;
                window.progress.levels[currentLevel].tpTotal = totalQuestions;
                if (isPassed) {
                    window.progress.levels[currentLevel].tpPassed = true;
                }
            }
            saveProgressToStorage();

            const levelInfo = window.progress.levels[currentLevel];
            const previousMCPassed = currentMode === 'tp' && levelInfo.mcPassed;
            const previousTPPassed = currentMode === 'mc' && levelInfo.tpPassed;
            
            if (levelInfo.mcPassed && levelInfo.tpPassed && isPassed && (previousMCPassed || previousTPPassed)) {
                setTimeout(function() {
                    alert('갈채! 해냈어 애기! 기특해. 공부도 중요하지만 당신을 항상 아껴주기! 🦐💖');
                }, 500);
            }

            document.getElementById('resultModal').classList.add('show');
        }

        function retryMode() {
            document.getElementById('resultModal').classList.remove('show');
            startMode(currentLevel, currentMode);
        }

        function backToLevelSelection() {
            document.getElementById('resultModal').classList.remove('show');
            document.getElementById('learningMode').classList.remove('active');
            renderLevelSelection();
        }

        function updateProgress() {
            const total = currentQuestions.length;
            const current = currentQuestionIndex + 1;
            document.getElementById('questionCounter').textContent = current + ' / ' + total;
            const percentage = (current / total) * 100;
            document.getElementById('progressFill').style.width = percentage + '%';
        }

        function showStatsModal() {
            updateStatsDisplay();
            document.getElementById('statsModal').classList.add('show');
        }

        function closeStatsModal() {
            document.getElementById('statsModal').classList.remove('show');
        }

        function updateStatsDisplay() {
            const totalWords = window.stats.totalAttempts;
            const totalCorrect = window.stats.totalCorrect;
            const accuracy = totalWords > 0 ? Math.round((totalCorrect / totalWords) * 100) : 0;
            
            let completedLevels = 0;
            for (let i = 1; i <= 5; i++) {
                if (window.progress.levels[i].mcPassed && window.progress.levels[i].tpPassed) {
                    completedLevels++;
                }
            }

            document.getElementById('totalWords').textContent = totalWords + '개';
            document.getElementById('totalCorrect').textContent = totalCorrect + '개';
            document.getElementById('totalAccuracy').textContent = accuracy + '%';
            document.getElementById('completedLevels').textContent = completedLevels + '개';

            const mistakeList = document.getElementById('mistakeList');
            const mistakes = Object.values(window.stats.mistakes)
                .sort(function(a, b) { return b.count - a.count; })
                .slice(0, 10);

            if (mistakes.length === 0) {
                mistakeList.innerHTML = '<p style="text-align: center; color: #999;">아직 데이터가 없습니다.</p>';
            } else {
                mistakeList.innerHTML = mistakes.map(function(mistake) {
                    return '<div class="mistake-item">' +
                        '<div class="mistake-word">' + mistake.english + ' → ' + mistake.korean + '</div>' +
                        '<div class="mistake-count">틀린 횟수: ' + mistake.count + '회</div>' +
                        '</div>';
                }).join('');
            }
        }

        window.addEventListener('DOMContentLoaded', initializeApp);
    </script>
